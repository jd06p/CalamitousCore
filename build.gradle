plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = '1.0.0'
group = 'dev.karma.calamitouscore'
base { archivesName = 'calamitouscore' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { calamitouscore { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { calamitouscore { source sourceSets.main } } }
    }
}
configurations { shadeNone }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('libs/thedulling-0.3.1-forge-1.20.1.jar')
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    compileOnly files('libs/herobrine_prime.jar')
    compileOnly files('libs/Lunar-forge-1.20.1-0.2.7.jar')
    compileOnly files('libs/crc-1.0.5.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin { add sourceSets.main, 'calamitouscore.refmap.json'; config 'calamitouscore.mixins.json' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar {
    manifest.attributes([
       'MixinConfigs': 'calamitouscore.mixins.json',
       'Specification-Title': 'CalamitousCore',
       'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}
