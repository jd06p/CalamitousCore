plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = '1.0.0'
group = 'dev.karma.calamitouscore'
base { archivesName = 'calamitouscore' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// Java-only AAC decoder, isolated from other mods' codec packages; no native runtime or platform upgrade.
sourceSets.main.java.srcDir 'vendor/jaad-src'
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { calamitouscore { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { calamitouscore { source sourceSets.main } } }
    }
}
configurations { shadeNone }
dependencies {
    compileOnly files('libs/stellara-forge-1.20.1-0.1.4.jar')
    compileOnly files('libs/etched-3.0.4.jar', 'libs/sophisticatedbackpacksetchedintegration-1.0.0.jar', 'libs/sophisticatedcore-1.20.1-1.3.74.2217.jar')
    testRuntimeOnly files('libs/etched-3.0.4.jar')
    testCompileOnly files('libs/etched-3.0.4.jar')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files('libs/thedulling-0.3.1-forge-1.20.1.jar')
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    compileOnly files('libs/herobrine_prime.jar')
    compileOnly files('libs/Lunar-forge-1.20.1-0.2.7.jar')
    compileOnly files('libs/crc-1.0.5.jar')
    compileOnly files('libs/battlemusic-1.20.1-1.1.1.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin { add sourceSets.main, 'calamitouscore.refmap.json'; config 'calamitouscore.mixins.json' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
jar {
    manifest.attributes([
       'MixinConfigs': 'calamitouscore.mixins.json',
       'Specification-Title': 'CalamitousCore',
       'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}

tasks.register('verifyCrcData', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.crc.CrcRaidDataCheck'
}

tasks.register('verifyPetRevivalData', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.revival.PetRevivalDataCheck'
}

tasks.register('verifyEtchedCompat', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.etched.EtchedCompatCheck'
    if (project.hasProperty('soundCloudFixture')) {
        args project.property('soundCloudFixture'), project.findProperty('soundCloudDuration') ?: '0'
    }
}

tasks.register('verifyJukeboxPlayback', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.etched.JukeboxPlaybackCheck'
    if (project.hasProperty('soundCloudCacheDir')) args project.property('soundCloudCacheDir')
}

tasks.register('verifySoundCloudPns', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.etched.SoundCloudPnsCheck'
}

tasks.register('verifyTerramityMining', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.terramity.TerramityMiningCheck'
    args project.findProperty('terramityModsDir') ?: 'C:/Users/jd06p/curseforge/minecraft/Instances/Terramity Calamitous Edition/mods'
}


tasks.register('verifyStellaraRendering', JavaExec) {
    dependsOn testClasses, createMcpToSrg
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraRenderCheck'
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:-TieredCompilation', '-Xbatch', '-XX:CompileThreshold=1000'
    args file('libs/stellara-forge-1.20.1-0.1.4.jar'), file('build/createMcpToSrg/output.tsrg')
}


tasks.register('probeStellaraGpu', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraGlProbe'
}

tasks.register('exportStellaraGpuFixtures', JavaExec) {
    dependsOn testClasses, createMcpToSrg
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraRenderCheck'
    args file('libs/stellara-forge-1.20.1-0.1.4.jar'), file('build/createMcpToSrg/output.tsrg')
    systemProperty 'stellara.fixtureExport', file('build/stellara-gpu-fixtures').absolutePath
}

tasks.register('verifyStellaraGpu', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraGpuCheck'
    args file('build/stellara-gpu-fixtures')
}

tasks.register('verifyStellaraVisibility', JavaExec) {
    dependsOn testClasses, createMcpToSrg
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraRenderCheck'
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:-TieredCompilation', '-Xbatch', '-XX:CompileThreshold=1000'
    args file('libs/stellara-forge-1.20.1-0.1.4.jar'), file('build/createMcpToSrg/output.tsrg')
    systemProperty 'stellara.visibilityCheck', 'true'
}

tasks.register('verifyStellaraVisibilityGpu', JavaExec) {
    dependsOn testClasses, verifyStellaraVisibility
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraGpuCheck'
    args file('build/stellara-visibility-fixtures'), 'production'
}


tasks.register('captureStellaraWideFov', JavaExec) {
    dependsOn testClasses, createMcpToSrg
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraRenderCheck'
    args file('libs/stellara-forge-1.20.1-0.1.4.jar'), file('build/createMcpToSrg/output.tsrg')
    systemProperty 'stellara.visibilityCaptureOnly', 'true'
    systemProperty 'stellara.visibilityFov', '110'
}
tasks.register('verifyStellaraWideFovGpu', JavaExec) {
    dependsOn captureStellaraWideFov
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.karma.calamitouscore.compat.stellara.StellaraGpuCheck'
    args file('build/stellara-visibility-fixtures-110'), 'production', '110'
}
